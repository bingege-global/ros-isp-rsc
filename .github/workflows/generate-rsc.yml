name: Generate RouterOS ISP .rsc

on:
  schedule:
    - cron: '0 20 * * 0'   # 北京时间每周一凌晨 4 点
  workflow_dispatch:         # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Fetch CT (China Telecom) CIDRs
        run: |
          curl -sL https://gaoyifan.github.io/china-operator-ip/chinanet.txt | \
            sed '/^$/d' | \
            sed 's/^/add address=/;s/$/ list=CT/' > ct.rsc
          echo "CT: $(wc -l < ct.rsc) entries"

      - name: Fetch CU (China Unicom) CIDRs
        run: |
          curl -sL https://gaoyifan.github.io/china-operator-ip/unicom.txt | \
            sed '/^$/d' | \
            sed 's/^/add address=/;s/$/ list=CU/' > cu.rsc
          echo "CU: $(wc -l < cu.rsc) entries"

      - name: Build RouterOS import file
        run: |
          cat > isp.rsc << 'HEREDOC'
          /log info "Updating ISP address-lists (CT+CU)..."
          /ip firewall address-list
          :do { remove [find list=CT] } on-error={}
          :do { remove [find list=CU] } on-error={}
          HEREDOC
          cat ct.rsc >> isp.rsc
          cat cu.rsc >> isp.rsc
          echo ':log info "ISP address-lists updated OK"' >> isp.rsc

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: false
